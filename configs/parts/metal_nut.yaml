# Metal nut (MVTec AD metal_nut: publish numbers only). Frozen protocol for this part: change it only by a dated amendment in PROTOCOL.md.
#     python evaluate.py --config configs/parts/metal_nut.yaml --out results/metal_nut
# Every value below was set before the final run; how each was chosen is in PROTOCOL.md (section 4).

data:
  root: data/metal_nut              # landmarks.json + images/ + templates/Full/<golden>.<ext> (DATA_FORMAT.md)
  coord_origin: center          # the landmark picker uses the OpenCV convention
  mask: auto                    # golden object mask: <golden>_mask.png if present, else Otsu + morphology
  min_points: 3

work_long_side: null            # native resolution
tau_px: 10.3                     # 2 x the 95th percentile of the annotation floor over all three goldens
cv2_threads: 1

symmetry: {"Full": {"order": 4, "cycle": ["p2", "p3", "p4", "p5"]}}
                                # four identical tabs p2-p5 (clicked in order round the nut); p6, the centre, is not in the cycle

methods:
  - {name: identity}            # reference line: the raw misalignment of each pair
  - {name: phase_correlation}
  - {name: sift_ransac}
  - {name: lightglue_disk, params: {device: cpu}}       # device: cuda if torch sees a GPU (manifest.json records it)
  - {name: lightglue_sift, params: {device: cpu}}
  - name: contour_shape_match   # searches every distinct orientation (180/n deg) anywhere in the frame
    params: {max_rotation_deg: 45, max_scale_deviation: 0.15, max_translation_ratio: 0.5}
    declared: {rotation_deg: 45, scale_dev: 0.15, shift_frac: 0.5}
  # rotation search: the test image turned in 15 deg steps over 90 deg (360/n), the method's own score picks the angle
  - {name: phase_correlation+rot, params: {step_deg: 15, range_deg: 90}}
  - {name: sift_ransac+rot, params: {step_deg: 15, range_deg: 90}}
  - {name: lightglue_disk+rot, params: {step_deg: 15, range_deg: 90, device: cpu}}
  - {name: lightglue_sift+rot, params: {step_deg: 15, range_deg: 90, device: cpu}}

outputs:
  overlays: failures            # none | failures | all  (report.py copies examples from here)
  gt_check: true
  overlay_max_side: 1280
